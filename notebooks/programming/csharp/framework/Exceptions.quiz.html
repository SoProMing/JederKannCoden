<div id="exceptions-quiz" style="font-family: system-ui, sans-serif; max-width: 780px; line-height: 1.4;">

  <h2 style="margin: 0.2rem 0 0.6rem;">Exceptions – Mini-Quiz</h2>
  <p style="margin: 0 0 1rem;">10 Fragen zu try/catch/finally, throw, Exception-Typen und Best Practices.</p>

  <div id="quiz-card" style="border:1px solid #ddd;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);">
    <div id="progress" style="font-size:14px;color:#555;margin-bottom:8px;"></div>
    <div id="question" style="font-size:18px;font-weight:600;margin:8px 0 12px;"></div>
    <div id="choices" style="display:grid;gap:8px;"></div>
    <div id="feedback" style="margin-top:12px;min-height:24px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button id="skipBtn" style="padding:8px 12px;border:1px solid #999;border-radius:8px;background:#f7f7f7;cursor:pointer;">Überspringen</button>
      <button id="nextBtn" style="padding:8px 12px;border:1px solid #0b5;border-radius:8px;background:#0b5;color:white;cursor:pointer;">Weiter</button>
      <button id="restartBtn" style="padding:8px 12px;border:1px solid #555;border-radius:8px;background:white;cursor:pointer;display:none;">Nochmal</button>
      <div style="margin-left:auto;align-self:center;font-size:13px;color:#666;">Tipp: Antworten anklicken</div>
    </div>
  </div>

  <div id="result" style="display:none;margin-top:16px;border:1px solid #ddd;border-radius:12px;padding:16px;">
    <h3 style="margin-top:0;">Auswertung</h3>
    <p id="score"></p>
    <details><summary style="cursor:pointer;">Erklärungen anzeigen</summary><ol id="review"></ol></details>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  const QUESTIONS = [
    {
      q: 'Welche Aussage zu <code>finally</code> ist korrekt?',
      choices: [
        'Wird nur ausgeführt, wenn eine Exception auftritt.',
        'Wird nur ausgeführt, wenn keine Exception auftritt.',
        'Wird immer ausgeführt, egal ob eine Exception auftritt oder nicht.',
        'Wird nur nach einem <code>throw</code> ausgeführt.'
      ],
      correct: 2,
      explain: '<code>finally</code> läuft immer und ist ideal für Cleanup.'
    },
    {
      q: 'Welche Exception entsteht typischerweise bei <code>int x = 10 / 0;</code>?',
      choices: [
        'DivideByZeroException',
        'NullReferenceException',
        'ArgumentException',
        'IndexOutOfRangeException'
      ],
      correct: 0,
      explain: 'Division durch Null führt in C# zu <code>DivideByZeroException</code>.'
    },
    {
      q: 'Wie löst man eine Exception explizit aus?',
      choices: [
        '<code>throw new ArgumentException("...")</code>',
        '<code>catch new ArgumentException("...")</code>',
        '<code>raise ArgumentException</code>',
        '<code>error ArgumentException</code>'
      ],
      correct: 0,
      explain: 'Mit <code>throw new ...</code> wird eine Exception bewusst ausgelöst.'
    },
    {
      q: 'Was bewirkt <code>throw;</code> im <code>catch</code>-Block?',
      choices: [
        'Wirft die aktuelle Exception erneut.',
        'Wirft eine neue Exception ohne Nachricht.',
        'Unterdrückt die Exception.',
        'Beendet das Programm sofort.'
      ],
      correct: 0,
      explain: '<code>throw;</code> gibt die aktuelle Ausnahme weiter.'
    },
    {
      q: 'Wie definiert man eine benutzerdefinierte Exception?',
      choices: [
        '<code>class MyEx { }</code>',
        '<code>class MyEx : Exception { }</code>',
        '<code>struct MyEx : Exception { }</code>',
        '<code>interface MyEx : Exception { }</code>'
      ],
      correct: 1,
      explain: 'Custom Exceptions erben von <code>System.Exception</code>.'
    },
    {
      q: 'Welche Eigenschaft liefert die Stapelverfolgung einer Exception?',
      choices: [
        '<code>Message</code>',
        '<code>StackTrace</code>',
        '<code>InnerException</code>',
        '<code>Source</code>'
      ],
      correct: 1,
      explain: '<code>StackTrace</code> enthält die Aufrufkette.'
    },
    {
      q: 'Wofür steht <code>InnerException</code>?',
      choices: [
        'Ursprüngliche Exception, die eine weitere ausgelöst hat',
        'Name des Parameters, der ungültig war',
        'Stacktrace als String',
        'Ausnahme, die zuletzt gefangen wurde'
      ],
      correct: 0,
      explain: '<code>InnerException</code> enthält die zugrunde liegende Ausnahme.'
    },
    {
      q: 'Wofür ist <code>catch (...) when (...)</code> gedacht?',
      choices: [
        'Catch-Block nur bei erfüllter Bedingung ausführen',
        'Catch-Block asynchron ausführen',
        'Catch-Block immer überspringen',
        'Exception automatisch protokollieren'
      ],
      correct: 0,
      explain: 'Mit <code>when</code> filterst du Exceptions nach Bedingungen.'
    },
    {
      q: 'Welche Aussage zur Reihenfolge mehrerer <code>catch</code>-Blöcke stimmt?',
      choices: [
        'Allgemeine Exceptions vor spezifischen behandeln',
        'Spezifische Exceptions vor allgemeinen behandeln',
        'Die Reihenfolge ist egal',
        'Es darf nur einen <code>catch</code>-Block geben'
      ],
      correct: 1,
      explain: 'Spezifische <code>catch</code>-Blöcke müssen vor allgemeinen stehen.'
    },
    {
      q: 'Welches Sprachelement stellt sicher, dass <code>Dispose</code> aufgerufen wird?',
      choices: [
        '<code>using</code>',
        '<code>lock</code>',
        '<code>yield return</code>',
        '<code>goto</code>'
      ],
      correct: 0,
      explain: '<code>using</code> sorgt für automatische Ressourcenfreigabe.'
    }
  ];

  function shuffle(a){const arr=a.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  const state = { order: shuffle([...Array(QUESTIONS.length).keys()]), i: 0, correct: 0, answers: [] };

  const qEl = $("#question"), cEl = $("#choices"), fEl = $("#feedback"), pEl = $("#progress");
  const next = $("#nextBtn"), skip = $("#skipBtn"), restart = $("#restartBtn");
  const resultBox = $("#result"), score = $("#score"), review = $("#review");

  function render(){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    pEl.textContent = `Frage ${state.i+1}/${QUESTIONS.length}`;
    qEl.innerHTML = item.q; cEl.innerHTML = ""; fEl.innerHTML = "";
    item.choices.forEach((c,idx)=>{
      const b = document.createElement("button");
      b.innerHTML = c;
      Object.assign(b.style,{padding:"10px 12px",border:"1px solid #ccc",borderRadius:"8px",background:"white",textAlign:"left"});
      b.onclick = () => answer(idx);
      cEl.appendChild(b);
    });
  }

  function answer(chosen){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    const good = chosen === item.correct;
    state.answers[qi] = { chosen, good };
    if (good) state.correct++;

    [...cEl.children].forEach((b,i)=>{
      b.disabled = true;
      if (i === item.correct){ b.style.borderColor="#0b5"; b.style.background="rgba(0,180,80,.08)"; }
      if (i === chosen && !good){ b.style.borderColor="#b00"; b.style.background="rgba(200,0,0,.06)"; }
    });

    fEl.innerHTML = (good ? "✔️ Richtig" : "✖️ Falsch") + " — " + item.explain;
  }

  function nextQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function skipQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function showResult(){
    $("#quiz-card").style.display = "none";
    resultBox.style.display = "";
    const percent = Math.round(state.correct / QUESTIONS.length * 100);
    score.textContent = `${state.correct} von ${QUESTIONS.length} korrekt (${percent}%)`;
    review.innerHTML = "";
    state.order.forEach(qi=>{
      const it = QUESTIONS[qi], a = state.answers[qi];
      const li = document.createElement("li");
      const chosen = a ? it.choices[a.chosen] : "—";
      li.innerHTML = `<strong>${it.q}</strong><br>Deine Antwort: ${chosen}<br>Korrekt: ${it.choices[it.correct]}<br><span style="color:#555">${it.explain}</span>`;
      review.appendChild(li);
    });
    restart.style.display = "";
  }

  restart.onclick = () => {
    state.i = 0; state.correct = 0;
    state.order = shuffle([...Array(QUESTIONS.length).keys()]);
    $("#quiz-card").style.display = ""; resultBox.style.display = "none";
    render();
  };
  $("#nextBtn").onclick = nextQ;
  $("#skipBtn").onclick = skipQ;

  render();
})();
</script>
