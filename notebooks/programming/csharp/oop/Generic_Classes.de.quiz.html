<div id="generic-classes-quiz" style="font-family: system-ui, sans-serif; max-width: 780px; line-height: 1.4;">

  <h2 style="margin: 0.2rem 0 0.6rem;">Generische Klassen – Mini-Quiz</h2>
  <p style="margin: 0 0 1rem;">10 Fragen zu <code>T</code>, Constraints, <code>default(T)</code> und generischen Methoden.</p>

  <div id="quiz-card" style="border:1px solid #ddd;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);">
    <div id="progress" style="font-size:14px;color:#555;margin-bottom:8px;"></div>
    <div id="question" style="font-size:18px;font-weight:600;margin:8px 0 12px;"></div>
    <div id="choices" style="display:grid;gap:8px;"></div>
    <div id="feedback" style="margin-top:12px;min-height:24px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button id="skipBtn" style="padding:8px 12px;border:1px solid #999;border-radius:8px;background:#f7f7f7;cursor:pointer;">Überspringen</button>
      <button id="nextBtn" style="padding:8px 12px;border:1px solid #0b5;border-radius:8px;background:#0b5;color:white;cursor:pointer;">Weiter</button>
      <button id="restartBtn" style="padding:8px 12px;border:1px solid #555;border-radius:8px;background:white;cursor:pointer;display:none;">Nochmal</button>
      <div style="margin-left:auto;align-self:center;font-size:13px;color:#666;">Tipp: Antworten anklicken</div>
    </div>
  </div>

  <div id="result" style="display:none;margin-top:16px;border:1px solid #ddd;border-radius:12px;padding:16px;">
    <h3 style="margin-top:0;">Auswertung</h3>
    <p id="score"></p>
    <details><summary style="cursor:pointer;">Erklärungen anzeigen</summary><ol id="review"></ol></details>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  const QUESTIONS = [
    {
      q: 'Was bedeutet das <code>T</code> in <code>class Box&lt;T&gt;</code>?',
      choices: [
        'Ein Platzhalter für einen Typ, der beim Verwenden festgelegt wird',
        'Ein Schlüsselwort für Threads',
        'Ein Fixwert für int',
        'Ein spezieller Interface-Typ'
      ],
      correct: 0,
      explain: '<code>T</code> ist ein Typ-Parameter, der später konkret ersetzt wird.'
    },
    {
      q: 'Welcher Vorteil ist typisch für Generics?',
      choices: [
        'Typsicherheit ohne Casts',
        'Automatische Parallelisierung',
        'Garbage Collection wird deaktiviert',
        'Nur für Strings verwendbar'
      ],
      correct: 0,
      explain: 'Generics vermeiden Casts und liefern Typsicherheit.'
    },
    {
      q: 'Welche Deklaration ist eine generische Liste?',
      choices: [
        '<code>List&lt;int&gt; zahlen = new List&lt;int&gt;();</code>',
        '<code>List zahlen = new List();</code>',
        '<code>List(int) zahlen = new List(int);</code>',
        '<code>List{int} zahlen = new List{int}();</code>'
      ],
      correct: 0,
      explain: '<code>List&lt;T&gt;</code> ist die generische Sammlung.'
    },
    {
      q: 'Was bewirkt <code>where T : class</code>?',
      choices: [
        'T muss ein Referenztyp sein',
        'T muss ein Werttyp sein',
        'T muss eine Zahl sein',
        'T muss ein Array sein'
      ],
      correct: 0,
      explain: '<code>class</code>-Constraint erzwingt einen Referenztyp.'
    },
    {
      q: 'Was bewirkt <code>where T : new()</code>?',
      choices: [
        'T benötigt einen parameterlosen Konstruktor',
        'T muss immutable sein',
        'T muss von Exception erben',
        'T muss ein Interface sein'
      ],
      correct: 0,
      explain: 'Damit kann <code>new T()</code> verwendet werden.'
    },
    {
      q: 'Wofür steht <code>default(T)</code>?',
      choices: [
        'Standardwert des Typs (z. B. 0, null, false)',
        'Immer null, egal welcher Typ',
        'Immer 0, egal welcher Typ',
        'Der zuletzt gesetzte Wert'
      ],
      correct: 0,
      explain: '<code>default(T)</code> liefert den Standardwert des Typs.'
    },
    {
      q: 'Wie viele Typ-Parameter kann eine generische Klasse haben?',
      choices: [
        'Mehrere, z. B. <code>Pair&lt;T1, T2&gt;</code>',
        'Genau einen',
        'Nur zwei',
        'Nur bei Interfaces'
      ],
      correct: 0,
      explain: 'Mehrere Typ-Parameter sind möglich, z. B. <code>Dictionary&lt;TKey, TValue&gt;</code>.'
    },
    {
      q: 'Was ist eine generische Methode?',
      choices: [
        'Eine Methode mit eigenem Typ-Parameter, unabhängig von der Klasse',
        'Eine Methode, die nur int zurückgibt',
        'Eine Methode, die immer async ist',
        'Eine Methode, die nur in generischen Klassen existiert'
      ],
      correct: 0,
      explain: 'Generische Methoden haben eigene <code>&lt;T&gt;</code>-Parameter.'
    },
    {
      q: 'Wie verhalten sich statische Felder in generischen Klassen?',
      choices: [
        'Pro geschlossener Typ-Variante gibt es einen eigenen statischen Speicher',
        'Es gibt nur einen statischen Speicher für alle Typen',
        'Statische Felder sind in Generics nicht erlaubt',
        'Statische Felder sind immer null'
      ],
      correct: 0,
      explain: 'Jede geschlossene Genericspezialisierung hat eigene statische Felder.'
    },
    {
      q: 'Was ist ein typischer Einsatz von Generics?',
      choices: [
        'Wiederverwendbare Container wie <code>Box&lt;T&gt;</code> oder <code>Repository&lt;T&gt;</code>',
        'Dateisystemzugriffe',
        'Grafikrendering',
        'Nur für LINQ'
      ],
      correct: 0,
      explain: 'Generische Container und Repositories sind typische Anwendungsfälle.'
    }
  ];

  function shuffle(a){const arr=a.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  const state = { order: shuffle([...Array(QUESTIONS.length).keys()]), i: 0, correct: 0, answers: [] };

  const qEl = $("#question"), cEl = $("#choices"), fEl = $("#feedback"), pEl = $("#progress");
  const next = $("#nextBtn"), skip = $("#skipBtn"), restart = $("#restartBtn");
  const resultBox = $("#result"), score = $("#score"), review = $("#review");

  function render(){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    pEl.textContent = `Frage ${state.i+1}/${QUESTIONS.length}`;
    qEl.innerHTML = item.q; cEl.innerHTML = ""; fEl.innerHTML = "";
    item.choices.forEach((c,idx)=>{
      const b = document.createElement("button");
      b.innerHTML = c;
      Object.assign(b.style,{padding:"10px 12px",border:"1px solid #ccc",borderRadius:"8px",background:"white",textAlign:"left"});
      b.onclick = () => answer(idx);
      cEl.appendChild(b);
    });
  }

  function answer(chosen){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    const good = chosen === item.correct;
    state.answers[qi] = { chosen, good };
    if (good) state.correct++;

    [...cEl.children].forEach((b,i)=>{
      b.disabled = true;
      if (i === item.correct){ b.style.borderColor="#0b5"; b.style.background="rgba(0,180,80,.08)"; }
      if (i === chosen && !good){ b.style.borderColor="#b00"; b.style.background="rgba(200,0,0,.06)"; }
    });

    fEl.innerHTML = (good ? "✔️ Richtig" : "✖️ Falsch") + " — " + item.explain;
  }

  function nextQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function skipQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function showResult(){
    $("#quiz-card").style.display = "none";
    resultBox.style.display = "";
    const percent = Math.round(state.correct / QUESTIONS.length * 100);
    score.textContent = `${state.correct} von ${QUESTIONS.length} korrekt (${percent}%)`;
    review.innerHTML = "";
    state.order.forEach(qi=>{
      const it = QUESTIONS[qi], a = state.answers[qi];
      const li = document.createElement("li");
      const chosen = a ? it.choices[a.chosen] : "—";
      li.innerHTML = `<strong>${it.q}</strong><br>Deine Antwort: ${chosen}<br>Korrekt: ${it.choices[it.correct]}<br><span style="color:#555">${it.explain}</span>`;
      review.appendChild(li);
    });
    restart.style.display = "";
  }

  restart.onclick = () => {
    state.i = 0; state.correct = 0;
    state.order = shuffle([...Array(QUESTIONS.length).keys()]);
    $("#quiz-card").style.display = ""; resultBox.style.display = "none";
    render();
  };
  $("#nextBtn").onclick = nextQ;
  $("#skipBtn").onclick = skipQ;

  render();
})();
</script>
