<div id="events-quiz" style="font-family: system-ui, sans-serif; max-width: 780px; line-height: 1.4;">

  <h2 style="margin: 0.2rem 0 0.6rem;">Events – Mini-Quiz</h2>
  <p style="margin: 0 0 1rem;">10 Fragen zu event, EventHandler, Abos, und Best Practices.</p>

  <div id="quiz-card" style="border:1px solid #ddd;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);">
    <div id="progress" style="font-size:14px;color:#555;margin-bottom:8px;"></div>
    <div id="question" style="font-size:18px;font-weight:600;margin:8px 0 12px;"></div>
    <div id="choices" style="display:grid;gap:8px;"></div>
    <div id="feedback" style="margin-top:12px;min-height:24px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button id="skipBtn" style="padding:8px 12px;border:1px solid #999;border-radius:8px;background:#f7f7f7;cursor:pointer;">Überspringen</button>
      <button id="nextBtn" style="padding:8px 12px;border:1px solid #0b5;border-radius:8px;background:#0b5;color:white;cursor:pointer;">Weiter</button>
      <button id="restartBtn" style="padding:8px 12px;border:1px solid #555;border-radius:8px;background:white;cursor:pointer;display:none;">Nochmal</button>
      <div style="margin-left:auto;align-self:center;font-size:13px;color:#666;">Tipp: Antworten anklicken</div>
    </div>
  </div>

  <div id="result" style="display:none;margin-top:16px;border:1px solid #ddd;border-radius:12px;padding:16px;">
    <h3 style="margin-top:0;">Auswertung</h3>
    <p id="score"></p>
    <details><summary style="cursor:pointer;">Erklärungen anzeigen</summary><ol id="review"></ol></details>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  const QUESTIONS = [
    {
      q: 'Was erlaubt das Schlüsselwort <code>event</code> gegenüber einem reinen Delegate?',
      choices: [
        'Nur die deklarierende Klasse darf das Event auslösen; von außen nur <code>+=</code>/<code>-=</code>',
        'Events können nur einmal abonniert werden',
        'Events können keine Parameter haben',
        'Events sind automatisch asynchron'
      ],
      correct: 0,
      explain: '<code>event</code> kapselt die Invocation; außen darf man nur abonnieren/abbestellen.'
    },
    {
      q: 'Welche Standard-Signatur hat <code>EventHandler</code>?',
      choices: [
        '<code>(object sender, EventArgs e)</code>',
        '<code>(int sender, string e)</code>',
        '<code>(EventArgs e)</code>',
        '<code>(object e, string message)</code>'
      ],
      correct: 0,
      explain: 'Der Standard ist <code>object sender</code> und <code>EventArgs e</code>.'
    },
    {
      q: 'Wofür verwendet man <code>EventHandler&lt;TEventArgs&gt;</code>?',
      choices: [
        'Für Events mit eigenen Event-Daten',
        'Für Events ohne Abonnenten',
        'Für Events ohne Rückgabewert',
        'Für Events ohne Sender'
      ],
      correct: 0,
      explain: 'Damit lässt sich ein eigener <code>TEventArgs</code>-Typ transportieren.'
    },
    {
      q: 'Wie löst man ein Event sicher aus (Null-Check)?',
      choices: [
        '<code>MyEvent?.Invoke(this, EventArgs.Empty)</code>',
        '<code>MyEvent.Invoke()</code>',
        '<code>Invoke(MyEvent)</code>',
        '<code>MyEvent()</code>'
      ],
      correct: 0,
      explain: 'Mit dem Null-Conditional-Operator wird nur aufgerufen, wenn Abonnenten vorhanden sind.'
    },
    {
      q: 'Wie meldet man sich für ein Event an?',
      choices: [
        '<code>publisher.MyEvent += Handler;</code>',
        '<code>publisher.MyEvent = Handler;</code>',
        '<code>publisher.MyEvent++;</code>',
        '<code>publisher.MyEvent.Subscribe(Handler);</code>'
      ],
      correct: 0,
      explain: 'Abonnieren erfolgt mit <code>+=</code>.'
    },
    {
      q: 'Wie meldet man sich wieder ab?',
      choices: [
        '<code>publisher.MyEvent -= Handler;</code>',
        '<code>publisher.MyEvent = null;</code>',
        '<code>publisher.MyEvent--;</code>',
        '<code>publisher.MyEvent.Unsubscribe();</code>'
      ],
      correct: 0,
      explain: 'Abbestellen erfolgt mit <code>-=</code>.'
    },
    {
      q: 'Warum ist das Abmelden wichtig?',
      choices: [
        'Um Speicherleaks durch hängenbleibende Abonnenten zu vermeiden',
        'Weil Events sonst keine Daten senden',
        'Weil Events sonst nicht mehr ausgelöst werden',
        'Weil Events nur einmal verwendet werden dürfen'
      ],
      correct: 0,
      explain: 'Nicht abgemeldete Handler können Objekte am Leben halten.'
    },
    {
      q: 'Welche Aussage zu Events stimmt?',
      choices: [
        'Events sind multicast und können mehrere Abonnenten haben',
        'Events dürfen nie Lambdas verwenden',
        'Events können nicht mit Delegates kombiniert werden',
        'Events sind nur in WPF verfügbar'
      ],
      correct: 0,
      explain: 'Ein Event kann mehrere Handler enthalten.'
    },
    {
      q: 'Was ist der Nachteil eines anonymen Lambda-Handlers?',
      choices: [
        'Man kann ihn später nicht leicht wieder abmelden',
        'Er ist immer langsamer als eine Methode',
        'Er kann keine Parameter haben',
        'Er funktioniert nur mit async'
      ],
      correct: 0,
      explain: 'Ohne Referenz auf das Lambda ist <code>-=</code> nicht möglich.'
    },
    {
      q: 'Welches Muster beschreiben Events typischerweise?',
      choices: [
        'Observer/Publisher-Subscriber',
        'Factory Method',
        'Singleton',
        'Adapter'
      ],
      correct: 0,
      explain: 'Events folgen dem Observer-/Pub-Sub-Muster.'
    }
  ];

  function shuffle(a){const arr=a.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  const state = { order: shuffle([...Array(QUESTIONS.length).keys()]), i: 0, correct: 0, answers: [] };

  const qEl = $("#question"), cEl = $("#choices"), fEl = $("#feedback"), pEl = $("#progress");
  const next = $("#nextBtn"), skip = $("#skipBtn"), restart = $("#restartBtn");
  const resultBox = $("#result"), score = $("#score"), review = $("#review");

  function render(){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    pEl.textContent = `Frage ${state.i+1}/${QUESTIONS.length}`;
    qEl.innerHTML = item.q; cEl.innerHTML = ""; fEl.innerHTML = "";
    item.choices.forEach((c,idx)=>{
      const b = document.createElement("button");
      b.innerHTML = c;
      Object.assign(b.style,{padding:"10px 12px",border:"1px solid #ccc",borderRadius:"8px",background:"white",textAlign:"left"});
      b.onclick = () => answer(idx);
      cEl.appendChild(b);
    });
  }

  function answer(chosen){
    const qi = state.order[state.i], item = QUESTIONS[qi];
    const good = chosen === item.correct;
    state.answers[qi] = { chosen, good };
    if (good) state.correct++;

    [...cEl.children].forEach((b,i)=>{
      b.disabled = true;
      if (i === item.correct){ b.style.borderColor="#0b5"; b.style.background="rgba(0,180,80,.08)"; }
      if (i === chosen && !good){ b.style.borderColor="#b00"; b.style.background="rgba(200,0,0,.06)"; }
    });

    fEl.innerHTML = (good ? "✔️ Richtig" : "✖️ Falsch") + " — " + item.explain;
  }

  function nextQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function skipQ(){
    if (state.i < QUESTIONS.length - 1){ state.i++; render(); }
    else { showResult(); }
  }

  function showResult(){
    $("#quiz-card").style.display = "none";
    resultBox.style.display = "";
    const percent = Math.round(state.correct / QUESTIONS.length * 100);
    score.textContent = `${state.correct} von ${QUESTIONS.length} korrekt (${percent}%)`;
    review.innerHTML = "";
    state.order.forEach(qi=>{
      const it = QUESTIONS[qi], a = state.answers[qi];
      const li = document.createElement("li");
      const chosen = a ? it.choices[a.chosen] : "—";
      li.innerHTML = `<strong>${it.q}</strong><br>Deine Antwort: ${chosen}<br>Korrekt: ${it.choices[it.correct]}<br><span style="color:#555">${it.explain}</span>`;
      review.appendChild(li);
    });
    restart.style.display = "";
  }

  restart.onclick = () => {
    state.i = 0; state.correct = 0;
    state.order = shuffle([...Array(QUESTIONS.length).keys()]);
    $("#quiz-card").style.display = ""; resultBox.style.display = "none";
    render();
  };
  $("#nextBtn").onclick = nextQ;
  $("#skipBtn").onclick = skipQ;

  render();
})();
</script>
